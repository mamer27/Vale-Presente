<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Gerador de Vale Presente</title>
<style>
:root{--verde:#003732;--claro:#DCF0F0;--cinza:#f5f7f7;--txt:#1d2b2a;--erro:#b3261e;--ok:#1b7f4b}
*{box-sizing:border-box}body{margin:0;font-family:Aptos,Segoe UI,Arial,sans-serif;background:var(--cinza);color:var(--txt)}
header{background:var(--verde);color:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center}
header a{color:#cfe;font-size:14px}main{max-width:900px;margin:24px auto;padding:0 16px}
.card{background:#fff;border-radius:10px;padding:20px;margin-bottom:16px;box-shadow:0 1px 3px #0001}
h1{font-size:20px;margin:0}h2{font-size:17px;margin:0 0 10px}label{font-weight:600;display:block;margin:12px 0 4px}
input[type=file],input[type=password]{width:100%;padding:10px;border:1px solid #bcc9c8;border-radius:6px;background:#fff}
button,.btn{background:var(--verde);color:#fff;border:0;border-radius:6px;padding:11px 18px;font-size:15px;cursor:pointer;text-decoration:none;display:inline-block}
button:disabled{opacity:.5}.sec{background:var(--claro);color:var(--verde)}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:8px;border-bottom:1px solid #e3eaea;text-align:left}
.erro{color:var(--erro)}.ok{color:var(--ok)}.small{font-size:13px;color:#566}.aviso{background:#fff4d6;padding:10px;border-radius:6px;font-size:14px}
.barra{height:6px;background:#dde;border-radius:3px;overflow:hidden;margin-top:10px}.barra i{display:block;height:100%;width:40%;background:var(--verde);animation:m 1.2s infinite}
@keyframes m{0%{margin-left:-40%}100%{margin-left:100%}}
</style></head><body>
<header><h1>Gerador de Vale Presente · Núcleo de Incentivos</h1>{% block topo %}{% endblock %}</header>
<main>{% block corpo %}{% endblock %}</main></body></html>
