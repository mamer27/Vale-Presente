services:
  - type: web
    name: vale-presente
    runtime: python
    plan: free          # 512 MB não aguenta apurações de ~400 MB; veja o README
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 600 --bind 0.0.0.0:$PORT
    healthCheckPath: /saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.4   # só no Render; localmente funciona com o seu Python
      - key: SECRET_KEY
        generateValue: true
      - key: APP_PASSWORD
        sync: false        # você digita no painel do Render; não fica no código
